<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QTrust Only Store - Home</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#f2f3f5;display:flex;justify-content:center}
.app{width:100%;max-width:430px;min-height:100vh;background:#f2f3f5;position:relative;padding-bottom:90px}
.blue-card{margin:12px 16px;background:linear-gradient(135deg,#8aaaff 0%,#5a7eff 60%,#4a6cf7 100%);border-radius:28px;padding:20px 20px 18px;color:#fff;box-shadow:0 8px 24px rgba(74,108,247,.25)}
.badge{display:inline-block;background:rgba(0,0,0,.18);backdrop-filter:blur(6px);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;letter-spacing:.2px}
.title{font-size:32px;font-weight:900;margin-top:14px;line-height:1.1;letter-spacing:-.5px}
.addr{font-size:13px;margin-top:6px;opacity:.95;word-break:break-all;font-weight:400}
.white-card{margin:12px 16px;background:#fff;border-radius:22px;padding:20px 18px;box-shadow:0 2px 16px rgba(0,0,0,.06)}
.qid{font-size:20px;font-weight:800;color:#000}
.qaddr{font-size:14px;color:#000;margin-top:4px;word-break:break-all}
.wid{font-size:15px;color:#111;margin-top:18px;line-height:1.4}
.wid span{color:#000}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid #e8eaee;display:flex;justify-content:space-around;padding:10px 0 12px}
.nv{flex:1;text-align:center;font-size:12px;color:#8e9aaf;cursor:pointer;line-height:1.2}
.nv.on{color:#ff8a00}
.nv .ic{font-size:26px;display:block;margin-bottom:2px}
</style>
</head>
<body>
<div class="app">
  <div class="blue-card">
    <div class="badge">qtrust_39608aee • Decentralized • No Server</div>
    <div class="title">QTrust Only Store</div>
    <div class="addr">0x0ca0acbf094eff2844a0e58e082eefed16f612a2</div>
  </div>

  <div class="white-card">
    <div class="qid">qtrust_39608aee</div>
    <div class="qaddr">0x0ca0acbf094eff2844a0e58e082eefed16f612a2</div>
    <div class="wid">Wallet ID 128: wallet_qtrust_063b8c7c_0ca0acbf...<br>128cha...</div>
  </div>

  <div class="bottom">
    <div class="nv on"><span class="ic">🏠</span>Home</div>
    <div class="nv"><span class="ic">📊</span>Markets</div>
    <div class="nv"><span class="ic">🔐</span>Store</div>
    <div class="nv"><span class="ic">📈</span>Trade</div>
    <div class="nv"><span class="ic">⋯</span>More</div>
  </div>
</div>

<script>
// Dynamic - tera real ID se auto
const addr="0x0ca0acbf094eff2844a0e58e082eefed16f612a2";
const qid="qtrust_39608aee";
const walletId128="wallet_qtrust_063b8c7c_0ca0acbf094eff2844a0e58e082eefed16f612a2_"+Array(60).fill(0).map(()=>'a').join('');
document.querySelector('.badge').innerText=`${qid} • Decentralized • No Server`;
document.querySelector('.qid').innerText=qid;
document.querySelectorAll('.qaddr,.addr').forEach(e=>e.innerText=addr);
</script>
</body>
</html>
